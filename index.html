<div class="stage">
  <div class="deck" id="deck">
    <!-- Slides live in sections/*.html, fetched by the loader at the bottom of this file. -->
  </div>
</div>

<div class="progress"><i></i></div>
<div class="pager"></div>

<script>
// Sections are fetched, so the deck needs HTTP (GitHub Pages or a local server), not file://.
// Order here is slide order. Each section's inline <script> runs after all slides are in the
// DOM and before deck.js counts data-step reveals.
(async () => {
  const SECTIONS = [
    '00-cover',
    '00-outline',
    '01-what-is-nosql',
    '02-why-nosql',
    '03-four-types',
    '04-distributed-basics',
    '05-takeaways'
  ];
  // Cache-bust the stylesheet too: a cached deck.css leaves new slides unstyled.
  document.querySelector('link[href="css/deck.css"]').href = `css/deck.css?v=${Date.now()}`;
  const deck = document.getElementById('deck');
  const htmls = await Promise.all(SECTIONS.map((n) =>
    fetch(`sections/${n}.html`, { cache: 'no-cache' }).then((r) => {
      if (!r.ok) throw new Error(`sections/${n}.html: HTTP ${r.status}`);
      return r.text();
    })));
  const scripts = [];
  htmls.forEach((html) => {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    tpl.content.querySelectorAll('script').forEach((s) => { scripts.push(s.textContent); s.remove(); });
    deck.appendChild(tpl.content);
  });
  scripts.forEach((code) => {
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
  const engine = document.createElement('script');
  // Cache-bust: without this, browsers keep running a stale deck.js after edits.
  engine.src = `js/deck.js?v=${Date.now()}`;
  document.body.appendChild(engine);
})().catch((err) => {
  const hint = location.protocol === 'file:'
    ? 'Trang đang mở dạng file. Hãy chạy qua HTTP: <code>cd vntech-nosql &amp;&amp; python3 -m http.server</code>, rồi mở <code>http://localhost:8000</code>.'
    : 'Kiểm tra file có tồn tại và tên khớp với danh sách SECTIONS trong index.html.';
  document.getElementById('deck').innerHTML =
    `<p style="padding:2rem;color:var(--ink, #eee)">Không tải được slide: ${err.message}.<br>${hint}</p>`;
});
</script>
